name: Bootstrap macOS Apple Silicon port

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  port-and-verify:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve port patch
        run: cp .github/macos-port.patch /tmp/macos-port.patch

      - name: Import matching upstream source
        run: |
          git remote add upstream https://github.com/SK8-ENGINE/skate-3-rust-engine.git
          git fetch --depth=1 upstream af5640486253bd940d9b21c5029a9f835cd3e087
          git checkout --detach FETCH_HEAD

      - name: Apply macOS port
        run: |
          git apply --check /tmp/macos-port.patch
          git apply /tmp/macos-port.patch
          git diff --check

      - name: Verify Apple Silicon runner
        run: |
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          sw_vers
          rustc -vV

      - name: Check game binaries
        run: cargo check --locked -p skate-game --bins --no-default-features

      - name: Run portable crate tests
        run: cargo test --locked -p skate-core -p skate-audio -p skate-audio-fma -p skate-data -p skate-dynamics -p skate-mods -p skate-net

      - name: Build native release
        run: cargo build --release --locked -p skate-game --bin skate3rust --no-default-features

      - name: Verify Mach-O architecture
        run: |
          file target/release/skate3rust
          file target/release/skate3rust | grep -q arm64

      - name: Commit and push port
        run: |
          git config user.name "ChatGPT macOS port"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Port engine to macOS Apple Silicon"
          git push --force origin HEAD:main
